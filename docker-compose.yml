version: '3.3'

services:
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.6 
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis-evolution
    environment:
      - AUTHENTICATION_API_KEY=42968F67V9DF9V76HDSF98V7HDE10F7D57E11
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolutionpass@postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis-evolution:6379/0 
      - DEL_INSTANCE=false
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-accelerated-2d-canvas --no-first-run --no-zygote --single-process --disable-gpu

  postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolutionpass
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  redis-evolution:
    container_name: evolution_redis_internal
    image: redis:alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data

  redis-bot:
    container_name: bot_distributed_cache
    image: redis:alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bot_redis_data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azure_storage_emulator
    restart: always
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

volumes:
  evolution_postgres_data:
  evolution_redis_data:
  bot_redis_data:
  azurite_data: